<div class="container-card list">
  <h3 class="title">My Appointments</h3>
  <div *ngIf="items().length === 0" class="empty">
    No appointments yet.
  </div>
  <ul *ngIf="items().length > 0">
    <li *ngFor="let a of items()">
      <div class="info">
        <strong>{{ a.date }}</strong>
        <span class="time">{{ a.time }}</span>
        <span class="name">{{ a.name }}</span>
        <span class="email">{{ a.email }}</span>
      </div>
      <div class="actions">
        <button class="reschedule" (click)="openReschedule(a)">Reschedule</button>
        <button class="cancel" (click)="cancel(a.id)">Cancel</button>
      </div>
    </li>
  </ul>

  <app-reschedule-modal
    [open]="rescheduleOpen"
    [appointment]="activeAppointment"
    (closed)="closeReschedule()"
    (confirmed)="onRescheduleConfirmed($event)">
  </app-reschedule-modal>
</div>
