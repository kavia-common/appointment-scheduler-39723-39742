<header class="header">
  <button class="menu-btn" (click)="toggleSidebar()" aria-label="Toggle navigation">
    ☰
  </button>
  <div class="brand">
    <span class="logo">⏰</span>
    <h1>{{ title }}</h1>
  </div>
  <div class="header-actions">
    <a routerLink="/book" class="primary-btn">Book</a>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" [class.closed]="!sidebarOpen">
    <ul>
      <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Dashboard</a></li>
      <li><a routerLink="/book" routerLinkActive="active">Book Appointment</a></li>
      <li><a routerLink="/appointments" routerLinkActive="active">My Appointments</a></li>
      <li><a routerLink="/availability" routerLinkActive="active">Availability</a></li>
    </ul>
    <div class="sidebar-footer">
      <small>Ocean Professional</small>
    </div>
  </nav>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
